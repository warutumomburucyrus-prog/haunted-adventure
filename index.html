<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haunted Adventure</title>
  <!-- Dark, haunted look comes from this stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="starting">

  <!-- Header: pinned at the top. Holds the status bar and the inventory strip -->
  <div id="header">

    <!-- Status bar: the game title for now, the room name later -->
    <div id="status-bar">
      <span>HAUNTED ADVENTURE</span>
      <!-- Inventory strip: game code draws the carried items here -->
      <span id="inventory-strip" role="group" aria-label="Inventory" ></span>
      <span id="status-info"></span>

      <button type="button" id="sound-toggle" role="switch" aria-checked="true" aria-label="Sound" title="Sound: on">
        <span class="sw-label">SOUND</span>
        <span class="sw-track">
          <svg class="sw-crack" viewBox="0 0 64 36" aria-hidden="true">
            <path d="M30 0 L36 11 L27 17 L38 25 L31 36" />
          </svg>
          <span class="sw-knob"></span>
        </span>
        </button>
        
    </div>

    

  </div>

  <!-- Wrapper: lets the loading screen sit on top of the output area only -->
  <div id="output-wrap">

    <!-- Loading screen: black cover with LOADING and dots (hidden until the body is "starting") -->
    <div id="loading-screen">
      <div id="loading-title"><span id="loading-word">Loading</span><span id="loading-dots"></span></div>
      <!-- Prompt and hint stay hidden until game code shows them -->
      <div id="loading-prompt" class="loading-hidden">PRESS ANY KEY OR TAP TO ENTER</div>
    </div>

    <!-- Output_Display: history appears here, with the prompt as the last line -->
    <div id="output">
      <form id="command-form">
        <span id="prompt">&gt;&gt;</span>
        <span id="typed"></span><span id="cursor"></span><span id="typed-after"></span>
        <input type="text" id="command-input" maxlength="100" autocomplete="off" autofocus>
      </form>
    </div>

  </div>

  <!-- Game logic lives in this script -->
  <script src="game.js"></script>

</body>
</html>
